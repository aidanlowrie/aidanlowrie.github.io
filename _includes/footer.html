<footer class="site-footer">
  <div class="footer-links">
    {% if site.email != "" %}<a href="mailto:{{ site.email }}">Email</a>{% endif %}
    {% if site.github != "" %}<a href="https://github.com/{{ site.github }}">GitHub</a>{% endif %}
    {% if site.linkedin != "" %}<a href="https://www.linkedin.com/in/{{ site.linkedin }}">LinkedIn</a>{% endif %}
    {% if site.scholar != "" %}<a href="{{ site.scholar }}">Scholar</a>{% endif %}
    <a href="{{ '/now/' | relative_url }}">Now</a>
  </div>
  <p class="colophon">Built with Jekyll. © {{ site.time | date: '%Y' }} Aidan Lowrie.</p>
</footer>
