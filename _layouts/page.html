---
layout: default
---
<article class="page">
  {% if page.banner %}
    <header class="page-banner page-banner--{{ page.banner.theme | default: 'default' }}">
      <p class="banner-kicker">{{ page.banner.kicker }}</p>
      <h1>{{ page.title }}</h1>
      <p class="banner-summary">{{ page.banner.summary }}</p>
    </header>
  {% else %}
    <h1 class="page-title">{{ page.title }}</h1>
  {% endif %}
  {{ content }}
</article>
